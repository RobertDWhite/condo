name: homelab image

# Builds the condo monorepo into a single linux/amd64 image for the
# whitehouse-rke2 cluster and pushes it to ghcr.io/robertdwhite/condo.
# Upstream publishes no usable release image, so this fork owns the build.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: upstream ref to build (tag, branch or sha)
        required: true
        default: main
      tag:
        description: image tag to publish
        required: true
        default: dev

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/lib/node_modules "${AGENT_TOOLSDIRECTORY}"
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # The installer stage expects a turbo-pruned manifest tree at ./out
      - name: Prune manifest tree
        run: |
          mkdir -p out
          bash bin/prune.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BUILD_CMD=yarn turbo run build --filter=@app/condo --filter=@app/address-service
          tags: ghcr.io/robertdwhite/condo:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
